<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password | DocketTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/docket.css') }}">
  <style>body{display:grid;place-items:center;min-height:100vh;padding:20px;background:var(--docket-background)}.auth-card{width:min(100%,460px);padding:34px;border:1px solid var(--docket-border);border-radius:22px;background:#fff;box-shadow:var(--docket-shadow)}.auth-mark{width:48px;height:48px;display:grid;place-items:center;margin-bottom:20px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#7693ff,#315efb);font-size:1.3rem}</style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-mark"><i class="bi bi-key"></i></div>
    <h1 class="h3 mb-2">Create a new password</h1>
    <p class="text-secondary mb-4">Use at least eight characters. Your new password will protect your DocketTrack workspace.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
    <form method="post" action="{{ url_for('docket.reset_password', token=token) }}" novalidate>
      <label class="form-label" for="password">New password</label>
      <input class="form-control mb-3" id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
      <label class="form-label" for="confirm_password">Confirm password</label>
      <input class="form-control mb-4" id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
      <button class="btn btn-primary w-100" type="submit">Update password</button>
    </form>
  </main>
</body>
</html>
