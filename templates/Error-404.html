<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Page | TechSolutions Inc.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
        }
        
        .logo-icon {
            font-size: 3rem;
            color: #4dabf7;
            animation: pulse 2s infinite;
        }
        
        .logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #4dabf7, #38d9a9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        .content {
            padding: 40px;
            text-align: center;
        }
        
        .error-code {
            font-size: 10rem;
            font-weight: 800;
            background: linear-gradient(to right, #ff6b6b, #ff8e53);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            position: relative;
        }
        
        .error-code::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #4dabf7, #38d9a9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: -1;
            animation: glitch 2s infinite;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #f8f9fa;
        }
        
        .message {
            font-size: 1.2rem;
            line-height: 1.7;
            margin-bottom: 30px;
            color: #e9ecef;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        
        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(to right, #4dabf7, #3bc9db);
            color: white;
            box-shadow: 0 5px 15px rgba(77, 171, 247, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: #e9ecef;
            border: 2px solid #4dabf7;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(77, 171, 247, 0.6);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .footer {
            padding: 25px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #adb5bd;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .social-links a {
            color: #e9ecef;
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }
        
        .social-links a:hover {
            transform: translateY(-3px);
            color: #4dabf7;
        }
        
        .animation-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        
        .circles {
            position: relative;
            width: 150px;
            height: 150px;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        
        .circle-1 {
            width: 150px;
            height: 150px;
            border-top-color: #ff6b6b;
            animation: spin 8s linear infinite;
        }
        
        .circle-2 {
            width: 120px;
            height: 120px;
            top: 15px;
            left: 15px;
            border-top-color: #4dabf7;
            animation: spin 6s linear infinite reverse;
        }
        
        .circle-3 {
            width: 90px;
            height: 90px;
            top: 30px;
            left: 30px;
            border-top-color: #38d9a9;
            animation: spin 4s linear infinite;
        }
        
        /* Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .error-code { font-size: 7rem; }
            h1 { font-size: 2.2rem; }
            .content { padding: 30px 20px; }
        }
        
        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            h1 { font-size: 1.8rem; }
            .logo-text { font-size: 1.8rem; }
            .logo-icon { font-size: 2rem; }
            .message { font-size: 1rem; }
            .btn { padding: 12px 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                     <h1 style="font-family: myFirstFont;" class="sitename">Engineer<span
              style="color: #ef6603; font-size: xxx-large;">IP</span></h1>
            </div>
        </div>
        
        <div class="content">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p class="message">
                Oops! The page you're looking for seems to have taken a vacation. 
                It might have been moved, deleted, or perhaps you entered an incorrect URL. 
                Let's get you back on track.
            </p>
            

            <div class="actions">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-home"></i> Go to Homepage
                </a>
                <a href="/Contact-Us" class="btn btn-secondary">
                    <i class="fas fa-envelope"></i> Contact Support
                </a>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; 2025 EngineerIP. All rights reserved.</p>

        </div>
    </div>

    <script>
        // Dynamic error code display
        document.addEventListener('DOMContentLoaded', function() {
            const errorCode = document.querySelector('.error-code');
            const errorText = "404";
            
            if(errorText && errorText !== "404") {
                errorCode.textContent = errorText;
            }
            
            // Add animation to buttons on hover
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-5px)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
</body>
</html>
