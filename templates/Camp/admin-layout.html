<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicons -->
    <link href="../static/img/icon.png" sizes="32x32" rel="icon">



    <title>Engineer IP Dashboard</title>
    <!-- Bootstrap CSS -->

    <!-- Main CSS File -->
    <link href="static/css/main.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.css') }}">
    <script src="https://cdn.ckeditor.com/4.21.0/full-all/ckeditor.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            margin: 20px;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        table {
            margin-top: 20px;
        }

        .btn-action {
            margin-right: 5px;
        }

        .edit-row {
            display: none;
        }

        .footer-info {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>





<body>



    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <h3 style="color: #ef6603;" class="sitename"><em> Engineer</em><span
                    style="color: #ef6603; font-size: xx-large;">IP </span> <span style="color: white;">
                    Dashboard</span></h3>


            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                aria-labelledby="offcanvasDarkNavbarLabel">
                <div class="offcanvas-header">
                    <div class="dropdown"> <a href="#"
                            class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle"
                            data-bs-toggle="dropdown" aria-expanded="false"> <img src="https://github.com/mdo.png"
                                alt="" width="32" height="32" class="rounded-circle me-2"> <strong>
                                <h2>{{Admin_name}}</h2>
                            </strong> </a>
                        <ul class="dropdown-menu text-small shadow">
                            <li><a class="dropdown-item" href="#">New project...</a></li>
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="/logout">Sign out</a></li>
                        </ul>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>







                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/admin/projects' %}active{% endif %}"
                                aria-current="page" href="/admin/projects">Projects</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/campaigns/dashboard' %}active{% endif %}"
                                aria-current="page" href="/Campaigns-Automation">Campaigns Automation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/Share_file' %}active{% endif %}"
                                aria-current="page" href="/Share_file">Share files</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/campaigns/dashboard' %}active{% endif %}"
                                aria-current="page" href="/campaigns/dashboard">Run Campaigns</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/Edit-blogs' %}active{% endif %}"
                                href="/Edit-blogs">Edit Blogs</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/Edit-Testomony' %}active{% endif %}"
                                href="/Edit-Testomony">Edit
                                Testomony</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/Add-User' %}active{% endif %}"
                                href="/Add-User">Add User Dockttron</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/">HOME</a>
                        </li>
                    </ul>
                    <form class="d-flex mt-3" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-success" type="submit">Search</button>
                    </form>


                </div>
            </div>
        </div>
    </nav>







    {% block body %} {% endblock %}







    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>


</html>
